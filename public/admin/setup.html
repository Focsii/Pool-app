<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Pool Admin &middot; First-time setup</title>
<style>
  body{margin:0; background:#0E1013; color:#E9E7E2; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  .wrap{max-width:480px; margin:0 auto; padding:24px 16px 60px;}
  h1{font-size:20px; margin:0 0 6px;}
  p{color:#8A8F9C; font-size:14px; line-height:1.5;}
  .card{background:#161920; border:1px solid #272C36; border-radius:14px; padding:18px; margin-top:18px;}
  label{display:block; font-size:12px; color:#8A8F9C; margin:0 0 6px;}
  input{width:100%; box-sizing:border-box; background:#1D212A; border:1px solid #272C36; color:#E9E7E2; border-radius:9px; padding:11px 12px; font-size:15px; margin-bottom:14px;}
  button{width:100%; padding:12px; border-radius:9px; border:none; font-size:15px; font-weight:600; background:#C9A15A; color:#1a1206;}
  .msg{font-size:14px; margin-top:14px; white-space:pre-wrap;}
  .ok{color:#5FBF8F;} .bad{color:#E07A6B;}
</style>
</head>
<body>
<div class="wrap">
  <h1>First-time setup</h1>
  <p>Run this once to create the database tables and your admin login. If it says "already-initialized," this has already run — go to <a href="/admin/" style="color:#C9A15A;">/admin/</a> and sign in instead.</p>
  <div class="card">
    <label for="email">Your admin email</label>
    <input id="email" type="email" placeholder="you@example.com">
    <label for="password">Choose an admin password</label>
    <input id="password" type="password" placeholder="At least 8 characters">
    <button onclick="runSetup()">Initialize</button>
    <div class="msg" id="msg"></div>
  </div>
</div>
<script>
async function runSetup(){
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const msgEl = document.getElementById('msg');
  msgEl.className = 'msg';
  msgEl.textContent = 'Working...';
  if (!email || password.length < 8){
    msgEl.className = 'msg bad';
    msgEl.textContent = 'Enter an email and a password of at least 8 characters.';
    return;
  }
  try {
    const res = await fetch('/.netlify/functions/setup', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ adminEmail: email, adminPassword: password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Setup failed');
    if (data.status === 'already-initialized'){
      msgEl.className = 'msg bad';
      msgEl.textContent = 'Already initialized. Go to /admin/ to sign in.';
    } else {
      msgEl.className = 'msg ok';
      msgEl.textContent = 'Done! Admin account created for ' + data.adminEmail + '. Go to /admin/ to sign in.';
    }
  } catch(e){
    msgEl.className = 'msg bad';
    msgEl.textContent = e.message;
  }
}
</script>
</body>
</html>
